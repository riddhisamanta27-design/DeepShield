<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepShield - AI Deepfake Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-3xl font-bold text-center mb-2 text-cyan-400">🛡️ DeepShield AI</h1>
        <p class="text-slate-400 text-center mb-6 text-sm">Upload images or videos to analyze synthetic manipulation and deepfakes.</p>

        <!-- Upload Box -->
        <div id="drop-zone" class="border-2 border-dashed border-slate-700 hover:border-cyan-500 rounded-xl p-6 text-center cursor-pointer transition bg-slate-950/50 mb-6">
            <input type="file" id="file-input" class="hidden" accept="image/*,video/*">
            <p class="text-slate-300 font-medium">Drag & drop your image or video here, or <span class="text-cyan-400 underline">browse</span></p>
            <p class="text-xs text-slate-500 mt-1">Supports PNG, JPG, MP4, AVI, MOV</p>
        </div>

        <!-- Preview Section -->
        <div id="preview-container" class="hidden mb-6 text-center">
            <div id="media-preview-wrapper" class="mb-4"></div>
            <button id="analyze-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 font-semibold py-3 rounded-xl transition shadow-lg text-white">
                Run Deepfake Analysis 🚀
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="hidden text-center py-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-400 mx-auto mb-4"></div>
            <p class="text-cyan-300 animate-pulse">Scanning spatial frames & temporal artifacts...</p>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-6">
            <h2 class="text-lg font-semibold mb-3 text-slate-200">Analysis Verdict:</h2>
            <div id="verdict-banner" class="p-4 rounded-lg text-center font-bold text-xl mb-4"></div>
            <div class="space-y-2 text-sm text-slate-300" id="metrics-list"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const mediaPreviewWrapper = document.getElementById('media-preview-wrapper');
        const analyzeBtn = document.getElementById('analyze-btn');
        const loadingState = document.getElementById('loading-state');
        const resultBox = document.getElementById('result-box');
        const verdictBanner = document.getElementById('verdict-banner');
        const metricsList = document.getElementById('metrics-list');

        let selectedFile = null;

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-cyan-500'); };
        dropZone.ondragleave = () => dropZone.classList.remove('border-cyan-500');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-cyan-500');
            handleFile(e.dataTransfer.files[0]);
        };

        function handleFile(file) {
            if (!file || (!file.type.startsWith('image/') && !file.type.startsWith('video/'))) {
                alert('Please upload a valid image or video file.');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            
            mediaPreviewWrapper.innerHTML = '';
            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.className = 'max-h-64 mx-auto rounded-lg border border-slate-700 object-contain';
                reader.onload = (e) => { img.src = e.target.result; };
                reader.readAsDataURL(file);
                mediaPreviewWrapper.appendChild(img);
            } else {
                const video = document.createElement('video');
                video.className = 'max-h-64 mx-auto rounded-lg border border-slate-700 object-contain';
                video.controls = true;
                reader.onload = (e) => { video.src = e.target.result; };
                reader.readAsDataURL(file);
                mediaPreviewWrapper.appendChild(video);
            }

            previewContainer.classList.remove('hidden');
            resultBox.classList.add('hidden');
        }

        analyzeBtn.onclick = async () => {
            if (!selectedFile) return;

            previewContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');
            resultBox.classList.add('hidden');

            const formData = new FormData();
            formData.append("file", selectedFile);

            try {
                const response = await fetch("http://127.0.0.1:8001/api/detect", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                loadingState.classList.add('hidden');
                resultBox.classList.remove('hidden');

                if (data.status === "success") {
                    const isFake = data.verdict === "FAKE";
                    verdictBanner.className = `p-4 rounded-lg text-center font-bold text-xl mb-4 ${isFake ? 'bg-red-950/80 text-red-400 border border-red-800' : 'bg-emerald-950/80 text-emerald-400 border border-emerald-800'}`;
                    verdictBanner.innerHTML = `${data.verdict} (${data.confidence}% Confidence)`;

                    let metricsHtml = `
                        <p>🔹 <b>Media Type:</b> ${data.media_type.toUpperCase()}</p>
                        <p>🔹 <b>Faces Detected:</b> ${data.faces_detected}</p>
                        <p>🔹 <b>Spatial Noise Score:</b> ${data.metrics.spatial_noise}</p>
                        <p>🔹 <b>Face Boundary Score:</b> ${data.metrics.face_boundary_score}%</p>
                        <p>🔹 <b>Eye Reflection Consistency:</b> ${data.metrics.eye_reflection_consistency}%</p>
                    `;

                    if (data.media_type === 'video') {
                        metricsHtml += `<p>🔹 <b>Temporal Flicker Score:</b> ${data.metrics.temporal_flicker_score}</p>`;
                    }
                    metricsHtml += `<p>🔹 <b>Compression Artifacts:</b> ${data.metrics.compression_artifacts}</p>`;

                    metricsList.innerHTML = metricsHtml;
                } else {
                    resultBox.innerHTML = `<p class="text-red-400 text-center">${data.message}</p>`;
                }
            } catch (error) {
                loadingState.classList.add('hidden');
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = `<p class="text-red-400 text-center">Failed to connect to backend server. Make sure main.py is running on port 8001!</p>`;
            }
        };
    </script>
</body>
</html>
